services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn myproject.wsgi:application --bind 0.0.0.0:8000
    restart: unless-stopped
    environment:
      - DEBUG=0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm start
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  db:
    restart: unless-stopped
