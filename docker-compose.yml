services:
  db:
    image: postgres:15-alpine
    container_name: db
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 2s
      retries: 10
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - app-network

  redis:
    container_name: redis
    image: "redis:alpine"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    ports:
      - "6379:6379"

  localstack:
    container_name: localstack
    build:
      context: ./localstack
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # Service port range
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/provisioned"]
      interval: 5s
      timeout: 10s
      retries: 25
    environment:
      - DEBUG=1
      - LS_LOG=trace
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1                    
    volumes:
      - "./data/ls_data:/var/lib/localstack"
      - "./localstack:/docker-entrypoint-initaws.d/terraform"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack/initialization.sh:/etc/localstack/init/ready.d/initialization.sh" # Automatic setup scripts
    networks:
      - app-network
  
  backend:
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - app-network
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/login/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - WATCHFILES_FORCE_POLLING=true
      - DEBUG=${DEBUG}
      - ALLOWED_HOST=${ALLOWED_HOST}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - POSTGRES_NAME=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
      - E2B_API_KEY=${E2B_API_KEY}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/code
    networks:
      - app-network
    environment:
      - DEBUG=${DEBUG}
      - ALLOWED_HOST=${ALLOWED_HOST}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - POSTGRES_NAME=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
      - E2B_API_KEY=${E2B_API_KEY}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: frontend
    depends_on:
      - db
    networks:
      - app-network
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
