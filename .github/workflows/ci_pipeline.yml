name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    environment: ci
    env:
      POSTGRES_NAME: ${{secrets.POSTGRES_NAME}}
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      ALLOWED_HOST: ${{vars.ALLOWED_HOST}}
      ALLOWED_HOST_2: ${{vars.ALLOWED_HOST_2}}
      ALLOWED_ORIGIN: ${{vars.ALLOWED_ORIGIN}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      NEXT_PUBLIC_URL: ${{vars.NEXT_PUBLIC_URL}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Services
        run: docker compose -f ./docker-compose.yml -f docker-compose.dev.yml up -d --build --wait

      - name: Run Django Tests
        run: docker compose -f ./docker-compose.yml -f docker-compose.dev.yml exec -T backend python manage.py test

      - name: Check Container Logs on Failure
        if: failure()
        run: |
          docker compose -f ./docker-compose.yml -f docker-compose.dev.yml logs

      - name: Stop Services
        if: always()
        run: docker compose down -v