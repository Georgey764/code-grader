name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    environment: ci
    env:
      POSTGRES_NAME: ${{secrets.POSTGRES_NAME}}
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      POSTGRES_HOST: ${{vars.POSTGRES_HOST}} #
      POSTGRES_PORT: ${{vars.POSTGRES_PORT}} #
      DEBUG: ${{vars.DEBUG}} #
      ALLOWED_HOST: ${{vars.ALLOWED_HOST}}
      ALLOWED_HOST_2: ${{vars.ALLOWED_HOST_2}}
      ALLOWED_ORIGIN: ${{vars.ALLOWED_ORIGIN}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      NEXT_PUBLIC_URL: ${{vars.NEXT_PUBLIC_URL}}
      CELERY_BROKER_URL: ${{vars.CELERY_BROKER_URL}} #
      CELERY_RESULT_BACKEND: ${{vars.CELERY_RESULT_BACKEND}} #
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}} #
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}} # 
      AWS_SESSION_TOKEN: ${{secrets.AWS_SESSION_TOKEN}} #
      AWS_STORAGE_BUCKET_NAME: ${{secrets.AWS_STORAGE_BUCKET_NAME}} #
      AWS_S3_REGION_NAME: ${{vars.AWS_S3_REGION_NAME}} #
      AWS_DEFAULT_REGION: ${{vars.AWS_DEFAULT_REGION}} #
      AWS_S3_ENDPOINT_URL: ${{secrets.AWS_S3_ENDPOINT_URL}} #
      E2B_API_KEY: ${{secrets.E2B_API_KEY}} #
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Services
        run: docker compose up -d --build --wait

      - name: Check for missing migrations
        run: |
          docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run Django Tests
        run: docker compose exec -T backend pytest

      - name: Check Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop Services
        if: always()
        run: docker compose down -v