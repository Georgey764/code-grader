name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    environment: ci
    env:
      POSTGRES_NAME: ${{secrets.POSTGRES_NAME}}
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      ALLOWED_HOST: ${{vars.ALLOWED_HOST}}
      ALLOWED_HOST_2: ${{vars.ALLOWED_HOST_2}}
      ALLOWED_ORIGIN: ${{vars.ALLOWED_ORIGIN}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      NEXT_PUBLIC_URL: ${{vars.NEXT_PUBLIC_URL}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Terraform
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform

      # MIGHT NEED: terraform-local, awscli, aws-cli-local, aws-sam-cli, aws-sam-cli-local to run lambda locally and test locally

      - name: Build and Start Services
        run: docker compose -f ./docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
      
      - name: Provision LocalStack with Terraform
        run: |
          tflocal init
          tflocal plan -out=tfplan
          tflocal apply -auto-approve tfplan

      - name: Check for missing migrations
        run: |
          docker compose -f ./docker-compose.yml -f docker-compose.dev.yml exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run Django Tests
        run: docker compose -f ./docker-compose.yml -f docker-compose.dev.yml exec -T backend pytest

      - name: Check Container Logs on Failure
        if: failure()
        run: |
          docker compose -f ./docker-compose.yml -f docker-compose.dev.yml logs

      - name: Stop Services
        if: always()
        run: docker compose -f ./docker-compose.yml -f docker-compose.dev.yml down -v